name: Validate Copilot skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  documents:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install LibreOffice and fixture font (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-liberation
      - name: Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask libreoffice
      - name: Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        run: choco install libreoffice-fresh -y --no-progress
      - name: Check bundled assets
        run: npm run build:check
      - name: Test contracts, generation, and real PDF export
        run: npm test
        env:
          REQUIRE_PDF_TESTS: "1"
